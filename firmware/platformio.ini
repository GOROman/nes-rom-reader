[env:m5stamp-s3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; 基板リビジョン。v0.2(データバスを駆動できる版)では 2 にする。
    ; v0.1 で 2 にすると P コマンドがバッファ出力と衝突するので絶対に上げないこと。
    -DBOARD_REV=1

; 基板v0.2 または「U6 Pin.1(DIR)→G40 ジャンパ」改造済み v0.1 用。
; 書き込み系(P)と YM2151(F/Y/Q)が有効になる。
[env:m5stamp-s3-rev2]
extends = env:m5stamp-s3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_REV=2
